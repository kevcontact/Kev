<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 26px 34px; }
  .spec { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--hair); }
  .spec:last-child{ border-bottom:0; }
  .spec .lbl { color:var(--fg2); font-size:11px; letter-spacing:.06em; text-transform:uppercase; width:108px; flex:none; }
  .samp { font-weight:700; letter-spacing:-.02em; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
  <div class="spec"><span class="lbl">Display</span><span class="samp" style="font-size:42px;font-weight:800">J&nbsp;Balvin — Rio</span></div>
  <div class="spec"><span class="lbl">H2</span><span class="samp" style="font-size:30px">Tour Film</span></div>
  <div class="spec"><span class="lbl">H3 / list</span><span class="samp" style="font-size:22px">Maisak: Capsule</span></div>
  <div class="spec"><span class="lbl">Body 400</span><span class="samp" style="font-size:17px;font-weight:400">Director & photographer.</span></div>
</body>
</html>

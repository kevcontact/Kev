<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; height:150px; display:flex; align-items:center; gap:26px; padding-left:40px; }
  .dot { width:46px; height:46px; border-radius:999px; background:var(--cursor); }
  .txt .a { font-size:14px; font-weight:600; }
  .txt .b { font-size:11px; color:var(--fg2); margin-top:5px; }
</style>
</head>
<body>
  <div class="dot"></div>
  <div class="txt">
    <div class="a">Custom cursor</div>
    <div class="b">Soft gray circle, rgba(13,13,13,.16), eased trail · grows over links · hidden on touch</div>
  </div>
</body>
</html>

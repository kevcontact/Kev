<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 18px 34px; }
  .idx { display:flex; flex-direction:column; }
  .ln { display:flex; align-items:baseline; gap:14px; padding:9px 0; border-bottom:1px solid var(--hair); transition:opacity .2s; }
  .ttl { font-size:21px; font-weight:700; letter-spacing:-.015em; }
  .yr { font-size:12px; color:var(--fg2); margin-left:auto; font-variant-numeric:tabular-nums; }
  .idx:hover .ln { opacity:.3; }
  .idx .ln:hover { opacity:1; }
  .idx .ln:hover .ttl { color:var(--ink); }
</style>
</head>
<body>
  <div class="idx">
    <div class="ln"><span class="ttl">J Balvin — Rio</span><span class="kev-tag">New Era</span><span class="yr">2024</span></div>
    <div class="ln"><span class="ttl">Maluma — Tour Film</span><span class="kev-tag">Sony Music</span><span class="yr">2024</span></div>
    <div class="ln"><span class="ttl">Maisak: Capsule</span><span class="kev-tag">Universal</span><span class="yr">2023</span></div>
  </div>
</body>
</html>

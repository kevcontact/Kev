<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px 34px; }
  .scale { display:flex; align-items:flex-end; gap:10px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .bar { width:26px; background:var(--ink); }
  .lab { font-size:10px; color:var(--fg2); letter-spacing:.02em; }
  .px { font-size:10px; color:var(--fg3); }
</style>
</head>
<body>
  <div class="scale">
    <div class="step"><div class="bar" style="height:8px"></div><div class="lab">2</div><div class="px">8</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="lab">4</div><div class="px">16</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="lab">5</div><div class="px">24</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="lab">6</div><div class="px">32</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="lab">7</div><div class="px">48</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="lab">8</div><div class="px">64</div></div>
    <div class="step"><div class="bar" style="height:96px"></div><div class="lab">9</div><div class="px">96</div></div>
    <div class="step"><div class="bar" style="height:128px"></div><div class="lab">10</div><div class="px">128</div></div>
  </div>
</body>
</html>

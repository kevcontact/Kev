<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; }
  .hdr { height:56px; display:flex; align-items:center; gap:22px; padding:0 28px; border-bottom:1px solid var(--hair); }
  .mark { font-weight:800; font-size:20px; letter-spacing:-.03em; }
  .menu { font-weight:500; font-size:14px; }
  .cap { padding:16px 28px; font-size:11px; color:var(--fg2); }
</style>
</head>
<body>
  <div class="hdr">
    <span class="mark">Kev.</span>
    <span class="kev-ticks"></span>
    <span class="menu">Menu</span>
  </div>
  <div class="cap">Persistent header — wordmark · film-strip tick ruler · Menu</div>
</body>
</html>

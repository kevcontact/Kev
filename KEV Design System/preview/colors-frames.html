<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 26px 34px; }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:80px; display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .lite { background:var(--frame); color:var(--fg2); }
  .dark { background:var(--frame-dark); color:#888; }
  .name { font-size:12px; font-weight:600; margin-top:9px; }
  .hex { font-size:11px; color:var(--fg2); letter-spacing:.03em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip lite">photo placeholder</div><div class="name">Frame · light</div><div class="hex">#ECECEC · --frame</div></div>
    <div class="sw"><div class="chip dark">video placeholder</div><div class="name">Frame · dark</div><div class="hex">#131313 · --frame-dark</div></div>
  </div>
</body>
</html>

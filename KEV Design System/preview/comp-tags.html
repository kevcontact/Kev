<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px 34px; display:flex; flex-direction:column; gap:20px; }
  .line { display:flex; align-items:center; gap:16px; }
  .cap { font-size:11px; color:var(--fg2); }
</style>
</head>
<body>
  <div class="line">
    <span class="kev-tag">New Era</span>
    <span class="kev-tag">Sony Music</span>
    <span class="kev-tag">Universal</span>
    <span class="cap">— inline tag (default, over light imagery)</span>
  </div>
  <div class="line">
    <span class="kev-tag kev-tag--solid">New Era</span>
    <span class="kev-tag kev-tag--solid">J Balvin</span>
    <span class="cap">— solid tag (over busy / dark imagery)</span>
  </div>
</body>
</html>

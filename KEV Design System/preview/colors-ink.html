<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 26px 34px; }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:74px; border:1px solid var(--hair); }
  .name { font-size:12px; font-weight:600; margin-top:9px; }
  .hex { font-size:11px; color:var(--fg2); letter-spacing:.03em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="name">Paper</div><div class="hex">#FFFFFF · --paper</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">Ink</div><div class="hex">#0D0D0D · --ink / fg1</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="name">Ink 2</div><div class="hex">#8A8A8A · --ink-2 / fg2</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="name">Ink 3</div><div class="hex">#BDBDBD · --ink-3 / fg3</div></div>
  </div>
</body>
</html>

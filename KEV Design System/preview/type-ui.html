<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px 34px; display:flex; flex-direction:column; gap:18px; }
  .grp { display:flex; align-items:center; gap:22px; }
  .grp > div { display:flex; flex-direction:column; gap:6px; }
  .cap { color:var(--fg3); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="grp">
    <div><span class="kev-label">Menu</span><span class="cap">.kev-label · medium</span></div>
    <div><span class="kev-caps">New Era</span><span class="cap">.kev-caps · uppercase</span></div>
    <div><span class="kev-counter">05 / 34</span><span class="cap">.kev-counter · tabular</span></div>
  </div>
  <div class="grp">
    <div><span class="kev-sub">Sony Music Latin</span><span class="cap">.kev-sub · secondary gray</span></div>
    <div><span style="font-weight:500">Pause&nbsp;&nbsp;Unmute&nbsp;&nbsp;<span style="color:var(--fg2)">0:42 / 3:18</span></span><span class="cap">text controls</span></div>
  </div>
</body>
</html>
